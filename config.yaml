# Ebenezer — Hyperliquid Copy Trader 설정
# 지갑 정보는 절대 이 파일에 넣지 않음. .env 파일 사용.

exchange:
  api_url: "https://api.hyperliquid.xyz"

# 추종 트레이더 (3~5명 권장, 처음엔 2명)
traders:
  - uid: "0x34827044cbd4b808fc1b189fce9f50e6dafae7c9"
    name: "TraderA"
    weight: 1.0
  - uid: "0xde82f068fdf3bbf7e81e11c910331732ac8df60c"
    name: "TraderB"
    weight: 1.0

consensus:
  min_traders: 2
  max_entry_lag_minutes: 30
  min_confidence: 0.4

position:
  mode: "RATIO"
  base_capital_pct: 0.95        # 자본 거의 전체 (소액 테스트)
  max_position_capital_pct: 0.95
  max_concurrent: 1             # 동시 1개만
  leverage: 5
  margin_type: "ISOLATED"

exits:
  hard_stop_loss_pct: 0.02      # -2% (레버리지 5배 → 자본 -10%)
  trailing_activation_pct: 0.03
  trailing_distance_pct: 0.015
  time_stop_hours: 4
  partial_tp_levels:
    - pct: 0.03
      close_ratio: 0.5

risk:
  max_daily_loss_pct: 0.03      # -3% (하드 상한 -5%)
  max_drawdown_pct: 0.10
  max_consecutive_losses: 3
  consecutive_loss_size_reduction: 0.5

filters:
  symbol_whitelist:
    # Hyperliquid 24h 거래량 Top 10
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "TONUSDT"
    - "HYPEUSDT"
    - "ZECUSDT"
    - "DOGEUSDT"
    - "JTOUSDT"
    - "TAOUSDT"
    - "XRPUSDT"
  symbol_blacklist: []
  max_atr_multiplier: 2.0
  max_funding_rate: 0.0005      # 0.05%
  max_signal_age_minutes: 3
  blackout_periods: []
    # FOMC 예시 — 필요 시 아래 형식으로 추가
    # - start: "2026-06-18T18:00:00Z"
    #   end: "2026-06-18T20:00:00Z"
    #   reason: "FOMC"

ops:
  poll_interval_sec: 20
  telegram_bot_token: "${TELEGRAM_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  log_level: "INFO"
  log_file: "/var/log/copytrader/bot.log"
  db_path: "/var/lib/copytrader/state.db"

mode:
  dry_run: false      # 🔴 실거래 모드
  paper_trading: false
